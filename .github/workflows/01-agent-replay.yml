name: 01-agent-replay

on:
  push:
    branches: [main]
    paths:
      - "projects/01-agent-replay/**"
      - ".github/workflows/01-agent-replay.yml"
  pull_request:
    paths:
      - "projects/01-agent-replay/**"
      - ".github/workflows/01-agent-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 01-agent-replay-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/01-agent-replay

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: projects/01-agent-replay/pyproject.toml

      - name: Install
        run: uv pip install -e '.[dev]'

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check
        run: mypy

      - name: Tests
        run: pytest --cov=agent_replay --cov-report=term --junitxml=junit.xml

      - name: Replay smoke test
        run: agent-replay demo --out-dir "$RUNNER_TEMP/demo"
